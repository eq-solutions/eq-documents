name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: Tag → GitHub release with dist/ artefacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Bundle artefacts
        run: |
          mkdir -p release
          cp dist/documents.esm.js dist/documents.esm.js.map dist/documents.iife.js release/
          cp -r dist/types release/types
          cd release && tar czf ../eq-documents-${{ github.ref_name }}.tar.gz .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            eq-documents-${{ github.ref_name }}.tar.gz
            dist/documents.iife.js
          generate_release_notes: true
